
<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Studio • Smart & Aesthetic Planner</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        studio: {
                            50: '#f4f6ff',
                            100: '#eceffc',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="w-full border-b border-slate-200 dark:border-slate-800 glass-card sticky top-0 z-40 transition-colors">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fa-solid fa-sparkles text-base"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-500 bg-clip-text text-transparent">
                        TaskFlow Studio
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">
                        Your calm & aesthetic daily workspace
                    </p>
                </div>
            </div>

            <button id="theme-toggle"
                    class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all"
                    aria-label="Toggle Theme">
                <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
            </button>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto px-4 py-8 flex-grow">

        <!-- Statistics -->
        <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="glass-card rounded-2xl p-5 shadow-sm flex items-center justify-between border-l-4 border-l-indigo-500">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">All Tasks</p>
                    <h3 id="stat-total" class="text-2xl font-bold mt-1 text-slate-800 dark:text-white">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-5 shadow-sm flex items-center justify-between border-l-4 border-l-amber-500">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">In Progress</p>
                    <h3 id="stat-active" class="text-2xl font-bold mt-1 text-amber-500">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-5 shadow-sm flex items-center justify-between border-l-4 border-l-emerald-500">
                <div>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Completed</p>
                    <h3 id="stat-completed" class="text-2xl font-bold mt-1 text-emerald-500">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
        </section>

        <!-- Task Form -->
        <section class="glass-card rounded-2xl p-6 shadow-sm mb-8 transition-all relative overflow-hidden">
            <div class="absolute top-0 right-0 w-32 h-32 bg-indigo-500/5 rounded-full blur-2xl pointer-events-none"></div>

            <h2 id="form-title" class="text-base font-semibold mb-4 flex items-center gap-2 text-slate-800 dark:text-slate-100">
                <i class="fa-solid fa-circle-plus text-indigo-500"></i> Add New Task
            </h2>

            <form id="task-form" class="space-y-4">
                <input type="hidden" id="task-id">

                <div>
                    <label for="task-title" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">
                        What needs to be done? *
                    </label>
                    <input type="text" id="task-title" required
                           placeholder="e.g. Plan weekend trip, finish project report..."
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/60 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label for="task-category" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Category</label>
                        <select id="task-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/60 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                            <option value="Personal">🏡 Personal</option>
                            <option value="Work" selected>💼 Work</option>
                            <option value="Ideas">💡 Ideas</option>
                            <option value="Shopping">🛒 Shopping</option>
                        </select>
                    </div>

                    <div>
                        <label for="task-priority" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Priority Level</label>
                        <select id="task-priority" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/60 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                            <option value="Low">🟢 Low Priority</option>
                            <option value="Medium" selected>🟡 Medium Priority</option>
                            <option value="High">🔴 High Priority</option>
                        </select>
                    </div>

                    <div>
                        <label for="task-due" class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1">Due Date</label>
                        <input type="date" id="task-due"
                               class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/60 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm">
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" id="cancel-btn"
                            class="hidden px-5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-medium transition-all">
                        Cancel
                    </button>

                    <button type="submit" id="submit-btn"
                            class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-500 text-white font-medium text-sm shadow-lg shadow-indigo-500/25 hover:opacity-95 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Filters and Search -->
        <section class="glass-card rounded-2xl p-4 shadow-sm mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-900/80 p-1 rounded-xl w-full sm:w-auto">
                <button data-filter="all" class="filter-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-medium transition-all bg-white dark:bg-slate-800 text-slate-800 dark:text-white shadow-sm">All Tasks</button>
                <button data-filter="active" class="filter-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-all">In Progress</button>
                <button data-filter="completed" class="filter-btn flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white transition-all">Completed</button>
            </div>

            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <div class="relative flex-grow sm:w-64">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="Search tasks..."
                           class="w-full pl-9 pr-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/60 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs transition-all">
                </div>

                <button id="clear-completed"
                        class="px-3 py-2 rounded-xl text-xs font-medium text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-all border border-transparent hover:border-rose-200 dark:hover:border-rose-900 whitespace-nowrap"
                        title="Clear Completed Tasks">
                    <i class="fa-solid fa-trash-can mr-1"></i> Clear Done
                </button>
            </div>
        </section>

        <!-- Task List -->
        <section>
            <div id="task-list" class="space-y-3"></div>

            <div id="empty-state" class="hidden text-center py-16 px-4 glass-card rounded-2xl shadow-sm">
                <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-indigo-50 dark:bg-indigo-950/50 flex items-center justify-center text-indigo-500 text-2xl">
                    <i class="fa-solid fa-clipboard-check"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700 dark:text-slate-200">All caught up!</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Add a new task above to start planning your day.</p>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-200 dark:border-slate-800 bg-white/40 dark:bg-slate-900/40 py-4 mt-auto">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-500 dark:text-slate-400">
            TaskFlow Studio • Saved locally to your browser automatically
        </div>
    </footer>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="px-4 py-3 rounded-xl shadow-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 text-xs font-medium flex items-center space-x-2">
            <i id="toast-icon" class="fa-solid fa-check-circle text-indigo-400"></i>
            <span id="toast-message">Action successful</span>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
