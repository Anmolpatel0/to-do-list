<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster Pro - Advanced To-Do Application</title>
    <link rel="stylesheet" href="crud.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>TaskMaster Pro</h1>
            <p class="subtitle">Efficient state management & local persistence</p>
        </header>

        <!-- Task Creation Form -->
        <form id="task-form" class="task-form">
            <input 
                type="text" 
                id="task-input" 
                placeholder="What needs to be done?" 
                autocomplete="off"
                required
            />
            <button type="submit" class="btn-primary">Add Task</button>
        </form>

        <!-- Filter Controls -->
        <nav class="filter-nav" aria-label="Task Filters">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </nav>

        <!-- Task List Container -->
        <section class="task-section">
            <ul id="task-list" class="task-list">
                <!-- Dynamically populated via JavaScript -->
            </ul>
        </section>

        <!-- Footer / Controls Bar -->
        <footer class="app-footer">
            <span id="task-count" class="task-count">0 items left</span>
            <button type="button" id="clear-completed" class="btn-text">Clear Completed</button>
        </footer>
    </main>
     <!-- add javascript -->
      <script src="crud.js"></script>
</body>
</html>
